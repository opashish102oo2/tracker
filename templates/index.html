<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AshishTech</title>

<style>

body{

    margin:0;
    padding:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    radial-gradient(circle at top,#031b34,#010814);

    font-family:Arial;

    overflow:hidden;
}

.container{

    width:360px;

    padding:35px;

    border-radius:28px;

    background:
    rgba(255,255,255,0.03);

    border:
    1px solid rgba(0,255,255,0.2);

    backdrop-filter:blur(15px);

    box-shadow:
    0 0 35px rgba(0,255,255,0.15);

    text-align:center;

    position:relative;
}

.title{

    font-size:58px;

    font-weight:bold;

    color:white;

    line-height:65px;

    letter-spacing:3px;
}

.title span{

    color:#00d9ff;
}

.subtitle{

    color:#00d9ff;

    font-size:15px;

    letter-spacing:5px;

    margin-top:12px;

    margin-bottom:35px;
}

.logo-box{

    width:210px;
    height:210px;

    margin:auto;

    border-radius:50%;

    overflow:hidden;

    border:
    3px solid #00d9ff;

    box-shadow:
    0 0 40px #00d9ff;
}

.logo-box img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.info{

    color:white;

    font-size:20px;

    margin-top:30px;

    margin-bottom:35px;
}

button{

    width:100%;

    padding:20px;

    border:none;

    border-radius:20px;

    background:
    linear-gradient(
    90deg,
    #00d9ff,
    #0066ff
    );

    color:white;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 0 25px rgba(0,217,255,0.5);
}

button:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 35px #00d9ff;
}

#status{

    margin-top:22px;

    color:#00ffcc;

    font-size:16px;
}

.footer{

    position:absolute;

    right:18px;

    bottom:12px;

    color:#8b8b8b;

    font-size:12px;
}

</style>

</head>

<body>

<div class="container">

    <div class="title">

        ASHISH <br>

        <span>TECH</span>

    </div>

    <div class="subtitle">

        EMERGENCY ACCESS SYSTEM

    </div>

    <!-- COOL CODER BOY IMAGE -->

    <div class="logo-box">

        <img src="https://cdn-icons-png.flaticon.com/512/9068/9068756.png">

    </div>

    <div class="info">

        Capture evidence in emergency.

    </div>

    <!-- START ACCESS SAME -->

    <button onclick="startAccess()">

        ENABLE ACCESS →

    </button>

    <div id="status">

        ● Waiting for permissions...

    </div>

    <div class="footer">

        Emergency Access

    </div>

</div>

startAccess()

</script>

</body>

</html>
